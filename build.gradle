plugins {
    id 'com.android.application' version '8.13.2' apply false
    id 'com.android.library' version '8.13.2' apply false
}

tasks.register('verifySources', Exec) {
    commandLine 'python3', 'scripts/verify-sources.py'
}

ext.pocketRustDir = file(providers.gradleProperty('pocketRustDir').getOrElse('third_party/pocket-rs'))
tasks.register('buildRustAndroid', Exec) {
    inputs.files(fileTree(pocketRustDir) { include 'crates/**', 'bindings/**', 'include/**', 'scripts/build-android.sh', 'Cargo.*', 'rust-toolchain.toml' })
    outputs.dir('.build/rust/android')
    environment 'PATH', System.getenv('PATH') + File.pathSeparator + System.getProperty('user.home') + '/.cargo/bin'
    commandLine 'bash', new File(pocketRustDir, 'scripts/build-android.sh'), file('.build/rust/android')
}
tasks.register('buildRustHost', Exec) {
    inputs.files(fileTree(pocketRustDir) { include 'crates/**', 'bindings/**', 'include/**', 'scripts/build-jni-host.sh', 'Cargo.*', 'rust-toolchain.toml' })
    outputs.dir('.build/rust/host')
    environment 'PATH', System.getenv('PATH') + File.pathSeparator + System.getProperty('user.home') + '/.cargo/bin'
    commandLine 'bash', new File(pocketRustDir, 'scripts/build-jni-host.sh'), file('.build/rust/host')
}

tasks.register('buildBridge', Exec) {
    inputs.dir('bridge/tsbridge')
    inputs.file('scripts/build-bridge.sh')
    inputs.property('abis', 'arm64-v8a,x86_64')
    outputs.file('.build/tsbridge.aar')
    outputs.dir('.build/tsbridge')
    commandLine 'bash', 'scripts/build-bridge.sh'
}
