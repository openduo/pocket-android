name: Verify Pocket E2
on: [push, pull_request, workflow_dispatch]
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache-dependency-path: bridge/tsbridge/go.sum
      - uses: android-actions/setup-android@v3
      - name: Prepare pinned Android tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358'
      - name: Prepare pinned gomobile binding tools
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260908204917-8b95e45f8d3e
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260908204917-8b95e45f8d3e
          gomobile init
      - name: Check architecture and host contracts
        run: |
          python3 scripts/check-architecture.py
          scripts/test-host.sh
      - name: Check Go bridge
        working-directory: bridge/tsbridge
        run: |
          go vet ./...
          go test ./...
      - name: Build generic arm64 APK
        run: scripts/build-android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: PocketE2-generic-arm64
          path: dist/PocketE2.apk
